name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Allow ESP32 local HTTP and WiFi assist permissions on Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />',
          ]
          insert = ''
          for perm in permissions:
              name = perm.split('android.permission.')[1].split('"')[0]
              if name not in s:
                  insert += '    ' + perm + '\n'
          if insert:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + insert)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application\n', '<application\n        android:usesCleartextTraffic="true"\n', 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android API 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Force compileSdk 36 for app and Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          home = Path.home()
          candidates = []
          candidates += list(Path('android/app').glob('build.gradle*'))
          candidates += list((home / '.pub-cache' / 'hosted' / 'pub.dev').glob('*/android/build.gradle*'))

          def patch_file(p: Path):
              if not p.exists():
                  return False
              s = p.read_text(errors='ignore')
              original = s
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdkVersion\(\s*\d+\s*\)', 'compileSdkVersion(36)', s)
              if s != original:
                  p.write_text(s)
                  print(f'patched compileSdk=36: {p}')
                  return True
              return False

          patched = 0
          for p in candidates:
              patched += 1 if patch_file(p) else 0
          print(f'compileSdk patch complete; files changed: {patched}')
          PY

      - name: Analyze source (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-cooler-release-apk
          path: android_app_flutter/build/app/outputs/flutter-apk/app-release.apk
