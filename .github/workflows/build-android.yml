name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          rm -rf android
          flutter create --platforms=android .

      - name: Allow ESP32 local HTTP and WiFi assist permissions on Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />',
              '<uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />',
          ]
          insert = ''
          for perm in permissions:
              name = perm.split('android.permission.')[1].split('"')[0]
              if name not in s:
                  insert += '    ' + perm + '\n'
          if insert:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + insert)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application\n', '<application\n        android:usesCleartextTraffic="true"\n', 1)
          p.write_text(s)
          PY

      - name: Add native WiFi MethodChannel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main_files = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if not main_files:
              raise SystemExit('MainActivity.kt not found')
          p = main_files[0]
          old = p.read_text()
          m = re.search(r'^package\s+(.+)$', old, re.M)
          package = m.group(1).strip() if m else 'com.example.smart_cooler_app'
          code = f'''package {package}

import android.Manifest
import android.content.Context
import android.content.pm.PackageManager
import android.net.ConnectivityManager
import android.net.Network
import android.net.NetworkCapabilities
import android.net.NetworkRequest
import android.net.wifi.WifiConfiguration
import android.net.wifi.WifiManager
import android.net.wifi.WifiNetworkSpecifier
import android.os.Build
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity: FlutterActivity() {{
    private val channelName = "smart_cooler/wifi"
    private var wifiNetworkCallback: ConnectivityManager.NetworkCallback? = null

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName).setMethodCallHandler {{ call, result ->
            when (call.method) {{
                "getSsid" -> result.success(getCurrentSsid())
                "connect" -> {{
                    val ssid = call.argument<String>("ssid") ?: ""
                    val password = call.argument<String>("password") ?: ""
                    if (ssid.isBlank()) result.success(false) else result.success(connectToWifi(ssid, password))
                }}
                else -> result.notImplemented()
            }}
        }}
    }}

    private fun hasPermission(permission: String): Boolean =
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) checkSelfPermission(permission) == PackageManager.PERMISSION_GRANTED else true

    private fun ensureWifiPermissions(): Boolean {{
        val needed = mutableListOf<String>()
        if (!hasPermission(Manifest.permission.ACCESS_FINE_LOCATION)) needed.add(Manifest.permission.ACCESS_FINE_LOCATION)
        if (Build.VERSION.SDK_INT >= 33 && !hasPermission(Manifest.permission.NEARBY_WIFI_DEVICES)) {{
            needed.add(Manifest.permission.NEARBY_WIFI_DEVICES)
        }}
        if (needed.isNotEmpty()) {{
            requestPermissions(needed.toTypedArray(), 7101)
            return false
        }}
        return true
    }}

    private fun getCurrentSsid(): String {{
        return try {{
            if (!ensureWifiPermissions()) return ""
            val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
            var ssid = wifiManager.connectionInfo?.ssid ?: ""
            if (ssid.startsWith("\"") && ssid.endsWith("\"") && ssid.length >= 2) ssid = ssid.substring(1, ssid.length - 1)
            if (ssid == "<unknown ssid>") "" else ssid
        }} catch (e: Exception) {{
            ""
        }}
    }}

    private fun connectToWifi(ssid: String, password: String): Boolean {{
        if (!ensureWifiPermissions()) return false
        return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) connectAndroidQPlus(ssid, password) else connectLegacy(ssid, password)
    }}

    private fun connectAndroidQPlus(ssid: String, password: String): Boolean {{
        return try {{
            val specBuilder = WifiNetworkSpecifier.Builder().setSsid(ssid)
            if (password.isNotEmpty()) specBuilder.setWpa2Passphrase(password)
            val request = NetworkRequest.Builder()
                .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                .setNetworkSpecifier(specBuilder.build())
                .build()
            val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
            wifiNetworkCallback?.let {{ cm.unregisterNetworkCallback(it) }}
            wifiNetworkCallback = object : ConnectivityManager.NetworkCallback() {{
                override fun onAvailable(network: Network) {{
                    super.onAvailable(network)
                    cm.bindProcessToNetwork(network)
                }}
            }}
            cm.requestNetwork(request, wifiNetworkCallback!!)
            true
        }} catch (e: Exception) {{
            false
        }}
    }}

    @Suppress("DEPRECATION")
    private fun connectLegacy(ssid: String, password: String): Boolean {{
        return try {{
            val wifiManager = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
            if (!wifiManager.isWifiEnabled) wifiManager.isWifiEnabled = true
            val config = WifiConfiguration()
            config.SSID = "\"$ssid\""
            if (password.isEmpty()) config.allowedKeyManagement.set(WifiConfiguration.KeyMgmt.NONE) else config.preSharedKey = "\"$password\""
            val netId = wifiManager.addNetwork(config)
            if (netId == -1) return false
            wifiManager.disconnect()
            wifiManager.enableNetwork(netId, true)
            wifiManager.reconnect()
            true
        }} catch (e: Exception) {{
            false
        }}
    }}
}}
'''
          p.write_text(code)
          print(f'Wrote native WiFi MethodChannel to {p}')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Install Android API 36
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Force compileSdk 36 for app and Flutter plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          home = Path.home()
          candidates = []
          candidates += list(Path('android/app').glob('build.gradle*'))
          candidates += list((home / '.pub-cache' / 'hosted' / 'pub.dev').glob('*/android/build.gradle*'))

          def patch_file(p: Path):
              if not p.exists():
                  return False
              s = p.read_text(errors='ignore')
              original = s
              s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              s = s.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              s = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', s)
              s = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', s)
              s = re.sub(r'compileSdkVersion\(\s*\d+\s*\)', 'compileSdkVersion(36)', s)
              if s != original:
                  p.write_text(s)
                  print(f'patched compileSdk=36: {p}')
                  return True
              return False

          patched = 0
          for p in candidates:
              patched += 1 if patch_file(p) else 0
          print(f'compileSdk patch complete; files changed: {patched}')
          PY

      - name: Analyze source (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-cooler-release-apk
          path: android_app_flutter/build/app/outputs/flutter-apk/app-release.apk
